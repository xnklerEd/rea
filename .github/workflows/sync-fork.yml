name: Sync fork with upstream

on:
  schedule:
    # Daily at 04:17 UTC (avoids the top-of-hour rush).
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-fork
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main from morluto/rea
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          # Pushing a merge of upstream also pushes upstream's own workflow-file
          # changes; GITHUB_TOKEN cannot do that ("refusing to allow a GitHub App
          # to create or update workflow ... without `workflows` permission"), so
          # this needs a token that carries the `workflow` scope.
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Sync main from upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B main origin/main
          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream/main."
            exit 0
          fi

          before=$(git rev-parse HEAD)
          # Fork-local commits are kept: fast-forward when possible, otherwise a
          # merge commit. A plain --ff-only sync fails permanently as soon as the
          # fork carries its own commits (this workflow file is one).
          git merge --no-edit -m "chore: sync with morluto/rea" upstream/main
          after=$(git rev-parse HEAD)

          git push origin main
          echo "Synced main: $before -> $after"
